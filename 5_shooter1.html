<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>符號戰機：喵星降臨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            text-shadow: 0 0 10px #00ff00;
            font-size: 24px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border: 2px solid #333;
        }

        canvas {
            background: linear-gradient(to bottom, #000022, #000000);
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            width: 100%;
        }

        #score { color: #00ff00; }
        #lives { color: #ff3333; margin-top: 5px;}

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #loading-status {
            color: #FFFF00;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            background: #00ff00;
            color: black;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .btn:hover:not(:disabled) { background: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>✈️ 符號戰機 vs 圓滾滾喵星人 🐱</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        
        <div id="ui-layer">
            <div id="score">SCORE: 0</div>
            <div id="lives">LIVES: ❤️❤️❤️</div>
        </div>

        <div id="start-screen">
            <h2 style="color: #00ff00; font-size: 30px;">MISSION START</h2>
            <div id="loading-status">載入圖片中... (0/10)</div>
            <p>← → 移動 | 空白鍵 射擊</p>
            <button class="btn" id="startButton" onclick="startGame()" disabled>開始出擊</button>
        </div>

        <div id="game-over-screen" class="hidden">
            <h2 style="color: #ff3333; font-size: 40px;">GAME OVER</h2>
            <p id="final-score" style="font-size: 24px;">Score: 0</p>
            <button class="btn" onclick="startGame()">重新挑戰</button>
        </div>
    </div>

    <script>
        // --- 設定與資源 ---
        const canvas = document.getElementById('gameCanvas');
        if (!canvas.getContext) {
            alert("您的瀏覽器不支援 Canvas，無法執行遊戲。");
        }
        const ctx = canvas.getContext('2d');
        
        const loadingStatus = document.getElementById('loading-status');
        const startButton = document.getElementById('startButton');

        const CAT_IMAGES = [
            'cat1.jpg', 'cat2.jpg', 'cat3.jpg', 'cat4.jpg', 'cat5.jpg',
            'cat6.jpg', 'cat7.jpg', 'cat8.jpg', 'cat9.jpg', 'cat10.jpg'
        ];
        
        const loadedImages = [];
        let imagesReady = false;

        function preloadImages() {
            let loadedCount = 0;
            CAT_IMAGES.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    loadedImages.push(img);
                    loadedCount++;
                    loadingStatus.innerText = `載入圖片中... (${loadedCount}/${CAT_IMAGES.length})`;
                    checkReady();
                };
                img.onerror = () => {
                    loadedImages.push(null); 
                    loadedCount++;
                    loadingStatus.innerText = `載入圖片中... (${loadedCount}/${CAT_IMAGES.length}) (部分失敗)`;
                    checkReady();
                };
            });
            
            function checkReady() {
                if(loadedCount >= CAT_IMAGES.length) {
                    imagesReady = true;
                    loadingStatus.innerText = "圖片載入完成，可以開始遊戲！";
                    startButton.disabled = false;
                }
            }

            if (CAT_IMAGES.length === 0) checkReady(); 
        }
        
        // --- 音效系統 (合成音效) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(e => console.error("Audio resume failed:", e)); 
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- 遊戲物件類別 ---

        // 1. 符號戰機 (Player) - 已加入霓虹效果
        class Plane {
            constructor() {
                this.width = 60;
                this.height = 40;
                this.x = canvas.width / 2;
                this.y = canvas.height - 80;
                this.speed = 7;
                this.color = '#00ff00';
            }

            draw() {
                ctx.save(); // 保存繪圖狀態
                ctx.fillStyle = this.color; 
                
                // *** 修正 1: 加入霓虹效果，提高能見度 ***
                ctx.shadowColor = '#39FF14'; // 霓虹綠
                ctx.shadowBlur = 20; 
                
                ctx.font = 'bold 30px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 機頭
                ctx.fillText("A", this.x, this.y - 20);
                // 機翼與機身組合
                ctx.font = 'bold 34px Courier New';
                ctx.fillText("<=[=]=>", this.x, this.y);
                
                // 噴射尾焰 (尾焰不帶陰影)
                ctx.shadowBlur = 0; 
                ctx.font = '18px Courier New';
                ctx.fillStyle = `rgba(255, 150, 0, ${Math.random()})`; 
                ctx.fillText("vv", this.x, this.y + 25);
                
                ctx.restore(); // 恢復繪圖狀態，陰影不會影響其他物件
            }

            update(input) {
                if (input.keys['ArrowLeft']) this.x -= this.speed;
                if (input.keys['ArrowRight']) this.x += this.speed;

                if (this.x < 30) this.x = 30;
                if (this.x > canvas.width - 30) this.x = canvas.width - 30;
            }
        }

        // 2. 子彈 (Bullet)
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 10;
                this.radius = 3;
                this.markedForDeletion = false;
            }

            update() {
                this.y -= this.speed;
                if (this.y < 0) this.markedForDeletion = true;
            }

            draw() {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                ctx.fillRect(this.x - 1, this.y, 2, 15);
            }
        }

        // 3. 圓形貓咪 (Enemy) - 已降低起始速度
        class EnemyCat {
            constructor() {
                this.radius = 35; 
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius * 2;
                
                // *** 修正 2: 降低基礎速度，讓起始難度下降 ***
                // 基礎速度範圍: 0.8 到 1.8 
                this.speedY = Math.random() * 0.5 + 0.5 + (gameData.score / 1000); 
                
                this.image = loadedImages[Math.floor(Math.random() * loadedImages.length)];
                
                this.markedForDeletion = false;
                // this.rotation = Math.random() * Math.PI * 2;
                // this.rotationSpeed = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.y += this.speedY;
                // this.rotation += this.rotationSpeed;

                if (this.y > canvas.height + this.radius) {
                    this.markedForDeletion = true;
                    gameData.lives--;
                    updateUI();
                    if (gameData.lives <= 0) gameOver();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                // ctx.rotate(this.rotation);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.closePath();
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.clip(); 

                if (this.image) {
                    ctx.drawImage(this.image, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.fillStyle = '#FF4444';
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.fillText('X', 0, 0); 
                }

                ctx.restore();
            }
        }

        // 4. 爆炸特效
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.color = `hsl(${Math.random() * 60 + 10}, 100%, 50%)`;
                this.life = 1; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.05;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // --- 遊戲控制與核心邏輯 (其餘保持不變) ---
        class InputHandler {
            constructor() {
                this.keys = {};
                this.handleKeyDown = this.handleKeyDown.bind(this);
                this.handleKeyUp = this.handleKeyUp.bind(this);
                window.addEventListener('keydown', this.handleKeyDown);
                window.addEventListener('keyup', this.handleKeyUp);
            }
            
            handleKeyDown(e) {
                 this.keys[e.code] = true;
                 if (e.code === 'Space' && gameData.isPlaying && player) {
                    
                    // 💥 發射第一束子彈 (左側)
                    bullets.push(new Bullet(player.x - 10, player.y - 20));
                    
                    // 💥 發射第二束子彈 (右側)
                    bullets.push(new Bullet(player.x + 10, player.y - 20));
                    
                    playSound('shoot');
                    e.preventDefault(); 
                }            }
            
            handleKeyUp(e) {
                this.keys[e.code] = false;
            }
            
            dispose() {
                window.removeEventListener('keydown', this.handleKeyDown);
                window.removeEventListener('keyup', this.handleKeyUp);
            }
        }

        let player;
        let input;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let enemyTimer = 0;
        let enemyInterval = 60; 
        let animationId;

        const gameData = {
            score: 0,
            lives: 3,
            isPlaying: false
        };

        function startGame() {
            if (!imagesReady) return;
            
            if (animationId) cancelAnimationFrame(animationId);
            if (input) input.dispose();

            if (audioCtx.state === 'suspended') {
                 audioCtx.resume().then(() => {
                    console.log("AudioContext resumed on user interaction.");
                 }).catch(err => {
                    console.error("Failed to resume AudioContext:", err);
                 });
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            gameData.score = 0;
            gameData.lives = 3;
            gameData.isPlaying = true;
            
            player = new Plane();
            input = new InputHandler();
            bullets = [];
            enemies = [];
            particles = [];
            enemyTimer = 0;
            enemyInterval = 60;
            
            updateUI();
            
            animate();
        }

        function gameOver() {
            gameData.isPlaying = false;
            cancelAnimationFrame(animationId);
            if (input) input.dispose();
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = 'Score: ' + gameData.score;
        }

        function updateUI() {
            document.getElementById('score').innerText = 'SCORE: ' + gameData.score;
            let hearts = '';
            for(let i=0; i<gameData.lives; i++) hearts += '❤️';
            document.getElementById('lives').innerText = 'LIVES: ' + hearts;
        }

        function checkCollision(circle, x, y) {
            const dx = circle.x - x;
            const dy = circle.y - y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < circle.radius;
        }

        function checkPlaneCollision(circle, plane) {
            const dx = circle.x - plane.x;
            const dy = circle.y - plane.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < (circle.radius + 20);
        }

        function animate() {
            if (!gameData.isPlaying) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            player.update(input);
            player.draw(); // 飛機繪製順序優先，確保它在背景之上

            bullets = bullets.filter(bullet => {
                bullet.update();
                bullet.draw();
                return !bullet.markedForDeletion;
            });

            if (enemyTimer > enemyInterval) {
                enemies.push(new EnemyCat());
                enemyTimer = 0;
                enemyInterval = Math.max(20, 60 - Math.floor(gameData.score / 100));
            } else {
                enemyTimer++;
            }

            enemies.forEach(enemy => {
                enemy.update();
                enemy.draw();

                bullets.forEach(bullet => {
                    if (!bullet.markedForDeletion && checkCollision(enemy, bullet.x, bullet.y)) {
                        enemy.markedForDeletion = true;
                        bullet.markedForDeletion = true;
                        gameData.score += 10;
                        updateUI();
                        playSound('explosion');
                        
                        for(let i=0; i<8; i++){
                            particles.push(new Particle(enemy.x, enemy.y));
                        }
                    }
                });

                if (!enemy.markedForDeletion && checkPlaneCollision(enemy, player)) {
                    enemy.markedForDeletion = true;
                    gameData.lives--;
                    updateUI();
                    playSound('explosion');
                    
                    for(let i=0; i<15; i++){
                        particles.push(new Particle(player.x, player.y));
                    }
                    if (gameData.lives <= 0) gameOver();
                }
            });

            enemies = enemies.filter(e => !e.markedForDeletion);

            particles = particles.filter(p => {
                p.update();
                p.draw();
                return p.life > 0;
            });

            animationId = requestAnimationFrame(animate);
        }

        preloadImages();
        
    </script>
</body>
</html>
